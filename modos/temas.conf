# Registro único dos temas — lido por modos/trocar-tema.sh e modos/instalar-temas.sh.
# Para adicionar um tema: crie themes/<pasta>/ com os geradores no padrão (ver AGENTS.md → "Adicionar um tema")
# e acrescente UMA linha aqui. Campos separados por "|", sem espaços nas pontas:
#
# id        — nome usado em trocar-tema.sh <id> e no arquivo modos/modo-<id>.sh
# pasta     — pasta em themes/
# esquema   — nome do esquema de cores (.colors) — só instalado; as cores dos apps NÃO mudam na troca
# icones    — tema de ícones em ~/.local/share/icons
# decoracao — tema Aurorae em ~/.local/share/aurorae/themes
# pacote    — pacote de papel de parede em ~/.local/share/wallpapers
# imagem    — PNG horizontal (relativo à raiz do projeto) copiado para o pacote
# titulo    — nome do papel de parede exibido no KDE
# gerar     — "sim": instalar-temas.sh roda themes/<pasta>/tools/gerar-{esquema,tema-icones,decoracao}-<pasta>.py
#             "nao": o tema tem instalação própria (Washi: themes/washi/scripts/)
# gerador   — "-" para bitmap aprovado; ou script que desenha o papel de parede atual (roda com .venv/bin/python; ver scripts/gerar-papeis-de-parede.sh)
#
# id|pasta|esquema|icones|decoracao|pacote|imagem|titulo|gerar|gerador
